# .github/workflows/00_gemini_diagnostics.yml
name: "00 Gemini Diagnostics"

on:
  workflow_dispatch:

jobs:
  diagnostics:
    name: "Audit & Diagnose Gemini API"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Minimal Diagnostic Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests pyyaml

      - name: Run Deep Gemini Diagnostics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/diagnose_gemini.py

