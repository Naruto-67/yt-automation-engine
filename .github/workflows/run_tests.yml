# .github/workflows/run_tests.yml
name: Run Python Tests

on:
  push:
    branches: [main]
  workflow_dispatch: # This allows you to trigger it manually from the UI

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          echo "::group::Installing test dependencies..."
          python -m pip install --quiet --upgrade pip
          pip install --quiet pytest pytest-mock google-genai requests pytz pyyaml
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi
          echo "::endgroup::"
          echo "✅ Test environment ready."

      - name: Run Pytest
        env:
          TEST_MODE: "true"
        run: |
          python -m pytest tests/ -v

