name: Video Production Pipeline (v2.0)

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Format to generate'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long
      test_mode:
        description: 'Dry Run / Test Mode (bypasses YouTube API & preserves quota)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-pipeline
  cancel-in-progress: false

jobs:
  init_and_spec:
    name: 🚀 Init & Spec Generation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/spec.txt
      - name: Install Stage Dependencies
        run: pip install -r requirements/spec.txt
      - name: Run Spec Generation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_MODE: ${{ inputs.test_mode && 'true' || 'false' }}
        run: python -m engine.managers.pipeline_runner --stage spec --type ${{ inputs.video_type || 'short' }} ${{ inputs.test_mode && '--test-mode' || '' }}
      - name: Upload Spec Artifact
        uses: actions/upload-artifact@v7
        with:
          name: spec-artifact
          path: |
            output/spec.json
            output/narration.mp3
          if-no-files-found: warn
          retention-days: 1

  clip_generation:
    name: 🎬 Clip Generation
    needs: init_and_spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: spec-artifact
          path: output/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/clips.txt
      - name: Install Stage Dependencies
        run: pip install -r requirements/clips.txt
      - name: Fetch Video Clip Manifest
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python -m engine.managers.pipeline_runner --stage clips
      - name: Upload Clip Manifest
        uses: actions/upload-artifact@v7
        with:
          name: clips-manifest
          path: output/clips_manifest.json
          retention-days: 1

  video_editor:
    name: ✂️ Video Editor
    needs: [init_and_spec, clip_generation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: spec-artifact
          path: output/
      - uses: actions/download-artifact@v7
        with:
          name: clips-manifest
          path: output/
      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-freefont-ttf
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/editor.txt
      - name: Install Stage Dependencies
        run: pip install -r requirements/editor.txt
      - name: Download Stock Footage & Render Video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python -m engine.managers.pipeline_runner --stage editor
      - name: Upload Final Video
        uses: actions/upload-artifact@v7
        with:
          name: final-video
          path: output/final_render.mp4
          retention-days: 1

  release:
    name: 📦 YouTube Release
    needs: [init_and_spec, video_editor]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: spec-artifact
          path: output/
      - uses: actions/download-artifact@v7
        with:
          name: final-video
          path: output/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/release.txt
      - name: Install Stage Dependencies
        run: pip install -r requirements/release.txt
      - name: Collision-Aware Scheduling & Upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_MODE: ${{ inputs.test_mode && 'true' || 'false' }}
        run: python -m engine.managers.pipeline_runner --stage release ${{ inputs.test_mode && '--test-mode' || '' }}
