# .github/workflows/00_model_diagnostics.yml
name: "🔬 Multi-Provider Model Diagnostics & Health Audit"

on:
  schedule:
    # Daily at 08:30 UTC — 30 min after Google's quota reset (08:00 UTC / midnight PT)
    # Ensures all provider RPD limits are fresh before benchmarking
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      update_registry:
        description: "Synchronize healthy models with memory/dynamic_models_registry.json"
        required: false
        default: false
        type: boolean

jobs:
  diagnostics:
    name: "Audit & Benchmark All LLM Providers"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Diagnostic Dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q google-genai requests pyyaml
          echo "✅ Diagnostic environment ready."

      - name: Run Multi-Provider Model Diagnostics
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          UPDATE_REGISTRY: ${{ inputs.update_registry }}
        run: |
          python scripts/test_gh_token.py
          python scripts/model_diagnostics.py

      - name: Commit Updated Model Registry
        # Always sync on scheduled runs; on manual dispatch only when explicitly requested
        if: ${{ github.event_name == 'schedule' || inputs.update_registry == 'true' }}
        run: |
          git config --global user.name "Ghost-Engine-Bot"
          git config --global user.email "bot@ghostengine.ai"
          git add memory/dynamic_models_registry.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Chore: Update dynamic model registry after diagnostics [skip ci]"
            git push origin main
          fi

