# .github/workflows/00_model_diagnostics.yml
name: "🔬 Multi-Provider Model Diagnostics & Health Audit"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_registry:
        description: "Synchronize healthy models with memory/dynamic_models_registry.json"
        required: false
        default: false
        type: boolean

jobs:
  diagnostics:
    name: "Audit & Benchmark All LLM Providers"
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Diagnostic Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests pyyaml

      - name: Run Multi-Provider Model Diagnostics
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UPDATE_REGISTRY: ${{ inputs.update_registry }}
        run: |
          python scripts/model_diagnostics.py

      - name: Commit Updated Model Registry (If Requested)
        if: ${{ inputs.update_registry }}
        run: |
          git config --global user.name "Ghost-Engine-Bot"
          git config --global user.email "bot@ghostengine.ai"
          git add memory/dynamic_models_registry.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Chore: Update dynamic model registry after diagnostics [skip ci]"
            git push origin main
          fi

