# config/settings.yaml — Single-Channel Stock-Video Engine (v2.0)
version: "2.0.0"

pipeline:
  version: "2.0.0"
  output_dir: "output"
  debug_log: "output/debug.log"

# ─── VIDEO GENERATION PROFILES ───────────────────────────────────────────────
video_profiles:
  short:
    aspect_ratio: "9:16"
    resolution: "1080x1920"
    target_duration: 55
    cut_interval_seconds: 3.5
    visual_strategy: "asmr_retention" # High-motion satisfying ASMR/kinetic stock
    fps: 60
  long:
    aspect_ratio: "16:9"
    resolution: "1920x1080"
    target_duration: 600
    cut_interval_seconds: 6.0
    visual_strategy: "context_literal" # Fetches literal semantic matches for each scene
    fps: 60

# ─── COMPETITORS TO SPY ON ───────────────────────────────────────────────────
competitors:
  - "@BrainBlud"
  - "@FactFiend"

# ─── API LIMITS & HEALTH ─────────────────────────────────────────────────────
api_limits:
  youtube: 9200           # Daily safe ceiling (out of 10,000 points)
  gemini: 38              # Daily requests per day ceiling
  groq_tpm: 6000          # Tokens per minute rate limit
  pexels: 20000           # Monthly stock video clip requests
  pixabay: 5000           # Hourly stock video search requests
  cloudflare: 90          # Legacy fallback
  huggingface: 45         # Legacy fallback
  # Extended aliases
  youtube_points: 9200
  gemini_rpd: 38
  pexels_per_month: 20000
  pixabay_per_hour: 5000

# ─── BACKGROUND MUSIC & AUDIO ENGINEERING ────────────────────────────────────
music:
  volume: 0.05          # Subtle, chill Lo-Fi backing level beneath clear voiceover
  ducking_fade_seconds: 0.15 # 150ms smooth exponential crossfade before punchline silence
  silence_duration_seconds: 1.0 # 1s dead silence before climax
  fade_in_seconds: 1.0
  fade_out_seconds: 1.5

audio_mastering:
  target_lufs: -13.0
  loudness_range: 7.0
  true_peak: -1.0
  voice_gain: 1.8

# ─── CAPTION STYLING & HIGH-RETENTION TYPOGRAPHY ──────────────────────────────
captions:
  font_name: "Anton"
  font_size: 118               # Increased for high-impact bold readability on mobile screens
  font_size_long: 48           # Lower-third documentary sizing for 16:9 widescreen
  active_color: "&H0000FFFF"   # Vibrant Cyberpunk / Electric Yellow highlight (&HAABBGGRR)
  inactive_color: "&H00FFFFFF" # Pure crisp white for surrounding phrase words
  outline_color: "&H00000000"  # Solid pitch black outline
  outline_width: 8             # Enhanced border width for crisp contrast against fast-moving footage
  outline_width_long: 3        # Refined outline for long-form
  shadow_depth: 2
  max_words_per_chunk: 2       # 2-word dynamic phrase chunking (CapCut / BrainBlud viral style)
  max_words_per_chunk_long: 6  # Natural multi-word conversational flow for long-form
  uppercase: true
  uppercase_long: false        # Standard sentence casing for long-form documentary

# ─── DISCORD NOTIFICATIONS ───────────────────────────────────────────────────
notifications:
  enabled: true
  discord_webhook_env: "DISCORD_WEBHOOK"

# ─── LLM ROUTING CHAINS ──────────────────────────────────────────────────────
llm_model_fallback_chain:
  groq:
    - "llama-3.3-70b-versatile"
    - "llama-3.1-70b-versatile"
  gemini:
    - "gemini-2.5-flash"
    - "gemini-2.0-flash"
