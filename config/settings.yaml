# config/settings.yaml — Single-Channel Stock-Video Engine (v2.0)
version: "2.0.0"

pipeline:
  version: "2.0.0"
  output_dir: "output"
  debug_log: "output/debug.log"

# ─── VIDEO GENERATION PROFILES ───────────────────────────────────────────────
video_profiles:
  short:
    aspect_ratio: "9:16"
    resolution: "1080x1920"
    target_duration: 55
    cut_interval_seconds: 3.5
    visual_strategy: "abstract_retention" # Fetches high-motion satisfying/looping stock
    fps: 60
  long:
    aspect_ratio: "16:9"
    resolution: "1920x1080"
    target_duration: 600
    cut_interval_seconds: 6.0
    visual_strategy: "context_literal" # Fetches literal semantic matches for each scene
    fps: 60

# ─── COMPETITORS TO SPY ON ───────────────────────────────────────────────────
competitors:
  - "@BrainBlud"
  - "@FactFiend"

# ─── API LIMITS & HEALTH ─────────────────────────────────────────────────────
api_limits:
  gemini_rpd: 50
  groq_tpm: 6000
  youtube_points: 9200 # Daily safe ceiling (out of 10,000)
  pexels_per_month: 20000
  pixabay_per_hour: 5000

# ─── BACKGROUND MUSIC & AUDIO ENGINEERING ────────────────────────────────────
music:
  volume: 0.08          # ~-22 dB relative background level
  ducking_fade_seconds: 0.15 # 150ms smooth exponential crossfade before punchline silence
  silence_duration_seconds: 1.0 # 1s dead silence before climax
  fade_in_seconds: 1.0
  fade_out_seconds: 1.5

# ─── CAPTION STYLING & HIGH-RETENTION TYPOGRAPHY ──────────────────────────────
captions:
  font_name: "Anton"
  font_size: 72
  active_color: "&H0000FFFF" # Cyberpunk Yellow in ASS (&HAABBGGRR)
  inactive_color: "&H00FFFFFF" # Crisp white
  outline_color: "&H00000000" # Black outline
  outline_width: 4
  shadow_depth: 2
  max_words_per_chunk: 3

# ─── DISCORD NOTIFICATIONS ───────────────────────────────────────────────────
notifications:
  enabled: true
  discord_webhook_env: "DISCORD_WEBHOOK"

# ─── LLM ROUTING CHAINS ──────────────────────────────────────────────────────
llm_model_fallback_chain:
  groq:
    - "llama-3.3-70b-versatile"
    - "llama-3.1-70b-versatile"
  gemini:
    - "gemini-2.5-flash"
    - "gemini-2.0-flash"
