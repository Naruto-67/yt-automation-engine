# ─── VISUAL SETTINGS (PURE SATISFYING ASMR CRAFT) ─────────────────────────────
visual_settings:
  vault_blend_count: 3              # Automatically blend 2 to 3 rotating local vault clips per Short
  frame_inspect_enabled: true
  frame_brightness_min: 15
  # 100% Brand-Safe Tactile & Craft ASMR Queries (Zero kitchen, zero food, zero cutting meat)
  visual_taxonomy:
    - "soap carving cubes ASMR"
    - "kinetic sand squishing satisfying"
    - "carpet cleaning foam squeegee satisfying"
    - "colored pencils sharpening macro"
    - "wood turning lathe chisel shavings"
    - "pottery wheel clay shaping satisfying"
    - "thick oil paint palette knife canvas"
    - "sand pendulum harmonograph geometric"
    - "resin lathe turning wood polishing"
    - "ice block crushing hydraulic press ASMR"
    - "laser rust removal beam metal clean"
    - "marble run wooden track kinetic"
    - "wax seal stamp melting drip"
    - "honeycomb uncapping scraper golden wax"
    - "3d printing timelapse nozzle layer"
    - "fluid acrylic pour art colorful cells"
    - "bubble wrap popping slow motion"
    - "domino cascade chain reaction smooth"
    - "glitter slime scoop satisfying"
    - "hot wire foam cutting smooth shapes"
    - "peeling silicone spiked mat ASMR"
  # Channel-Specific Negative Keywords (Purges kitchen food prep, traffic, haircuts)
  banned_keywords:
    - "kitchen"
    - "cook"
    - "cooking"
    - "chef"
    - "cutting board"
    - "food"
    - "vegetable"
    - "fruit"
    - "meat"
    - "haircut"
    - "barber"
    - "street"
    - "traffic"

# ─── CAPTION & TYPOGRAPHY SETTINGS (TOPATO FLAGSHIP STYLE) ───────────────────
caption_settings:
  font_name: "ZY Resolve"
  font_file: "assets/fonts/ZY-Resolve.ttf"
  font_size: 88                # CapCut size 14 scale at 1080x1920
  font_size_long: 44           # Lower-third documentary sizing for 16:9 widescreen
  active_color: "&H0000E6FF"   # Vibrant Lemon Yellow highlight (#FFE600 in BGR)
  inactive_color: "&H00FFFFFF" # Pure crisp white for surrounding phrase words
  outline_color: "&H00000000"  # Solid pitch black stroke
  outline_width: 7             # CapCut stroke 30-35
  outline_width_long: 3        # Refined outline for long-form
  shadow_depth: 5              # CapCut distance 10 at 1080p scale
  shadow_blur: 3               # CapCut blur 15 soft shadow
  shadow_color: "&H33000000"   # 80% opacity black
  max_words_per_chunk: 2       # 2-word dynamic phrase chunking
  max_words_per_chunk_long: 6  # Natural multi-word conversational flow for long-form
  uppercase: true

# ─── TITLE & SEO SETTINGS ────────────────────────────────────────────────────
title_settings:
  style_template: "{title}"
  emojis: ["👀", "🔴", "⚡️", "🤯", "💀"]
  trend_window_days: 1

# ─── UPLOAD & LEARNING SETTINGS ──────────────────────────────────────────────
upload_settings:
  random_schedule: false
  schedule_window_hours: 4
  adaptive_schedule_learning: true   # Auto-tune release time to channel's peak view velocity hour
  generate_community_post: true     # Generate subscriber discussion poll / pinned comment
  thumbnail_strategy: "hook_frame"  # hook_frame (t=1.2s bold hook caption) or first_frame
  thumbnail_custom_path: ""
  category_id: "24"                  # 24 = Entertainment
  default_language: "en-US"
  default_audio_language: "en-US"
  contains_synthetic_media: false
  notify_subscribers_shorts: false
  notify_subscribers_long: true
  public_stats_viewable_shorts: false
  public_stats_viewable_long: true
  license: "youtube"
  embeddable: true
  made_for_kids: false
