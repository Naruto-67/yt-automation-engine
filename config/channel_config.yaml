# config/channel_config.yaml — Single Channel Configuration (v2.0)
channel:
  name: "TOPATO"
  handle: "@metopato"
  niche: "psychology_and_facts"
  language: "en-US"
  voice:
    provider: "kokoro"
    voice_id: "am_michael" # Flagship Grade A Kokoro American Male voice (also am_fenrir, am_adam)
    fallback_voice_id: "en-US-ChristopherNeural"
  branding:
    enabled: true
    watermark_text: "@metopato"
    opacity: 0.35 # Subtle, elegant branding transparency (35%)
    position: "lower_center" # Lower-center sweet spot below captions
    font_size: 26
    font_family: "Montserrat-SemiBold"
  upload_defaults:
    privacy: "private"
    category_id: "27" # Education
    made_for_kids: false

