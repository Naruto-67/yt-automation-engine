# config/channels.yaml
version: "26.0.0"
version: "27.0.0"

channels:
  - id: "CH_01"
    name: "AnimeRise"
    niche: "3D/Pixar-Style Moral Storytelling"
    target_audience: "US"
    category_id: "1"          # Film & Animation — higher RPM than People & Blogs (22)
    language: "en"             # English TTS — required for US ad targeting
    locale: "en-US"
    tts_locale: "en-US"
    content_type: "fictional"  # Signals script_gen to use storytelling rules, not fact rules
    brand_voice: "Warm, cinematic narrator — like a campfire storyteller who knows Pixar films by heart. Gentle pacing, vivid imagery, and an earned emotional moment at the end."
    personality:
      - "warm and empathetic"
      - "visually descriptive"
      - "quietly profound — the lesson sneaks up on you"

    # ── Character Anchor: Visual Style Card ──────────────────────────────────
    # Defines the permanent art style for ALL AnimeRise videos.
    # Used by engine/character_anchor.py to prepend a style lock to every image prompt.
    visual_style_card:
      art_style: "Studio Ghibli-inspired watercolor anime, warm amber and gold palette, soft expressive linework"
      render_engine: "2D hand-drawn animation aesthetic, painterly backgrounds, cel-shaded characters"
      color_treatment: "warm golden hour lighting, muted earth tones, soft atmospheric glow, high contrast character silhouettes"

    # ── Narrator Persona Card ─────────────────────────────────────────────────
    # Structured persona injected into the script generation prompt.
    # More precise than the free-text brand_voice field — LLM can operationalize these.
    narrator_persona:
      name: "The Ember Narrator"
      tone: "Warm, unhurried, cinematic — speaks like a wise elder around a fire, never rushes, lets silence breathe"
      vocabulary:
        - "Use vivid sensory details (what they heard, felt, smelled)"
        - "Short declarative sentences for impact beats"
        - "Vary rhythm — long flowing description then one punchy line"
        - "Prefer concrete nouns over abstract ones"
      forbidden_words:
        - "remarkable"
        - "fascinating"
        - "incredible"
        - "amazing"
        - "ultimately"
        - "journey"
        - "tapestry"
        - "delve"
        - "truly"
        - "simply"

    youtube_client_id_env: "YOUTUBE_CLIENT_ID_CH1"
    youtube_client_secret_env: "YOUTUBE_CLIENT_SECRET_CH1"
    youtube_refresh_token_env: "YOUTUBE_REFRESH_TOKEN_CH1"
    discord_webhook_env: "DISCORD_WEBHOOK_CH1"
    active: true
    creative_lenses:
      - "A determined young apprentice who takes a daring risk to fix a master's mistake"
      - "Two sworn rivals forced to cooperate to escape an ancient subterranean labyrinth"
      - "An outcast inventor whose rejected creation saves their entire village"
      - "A fearless young scout venturing into forbidden territory to rescue a lost friend"
      - "A rookie pilot navigating their first solo flight through an uncharted storm"
      - "A stubborn street kid who discovers they possess a rare, untamed magical gift"
      - "A solitary guardian protecting the last sanctuary from encroaching darkness"
      - "An unlikely friendship between a gentle giant creature and a courageous child"

  - id: "CH_02"
    name: "Topato"
    niche: "trending facts, interesting facts, seasonal facts, educational facts, mind-blowing facts, random facts"
    target_audience: "US"
    category_id: "27"          # Education — highest-RPM tier for fact/educational content
    language: "en"              # English TTS — required for US ad targeting
    locale: "en-US"
    tts_locale: "en-US"
    content_type: "factual"    # Signals script_gen to enforce real facts and specifics
    brand_voice: "Punchy, curious, and conversational — like a smart friend who just learned something wild and has to tell you right now. Short sentences. Specific numbers. Never lectures."
    personality:
      - "casually brilliant — drops facts like it's nothing"
      - "dry wit — funny without trying to be funny"
      - "direct and specific — no vague claims, always the exact number or name"

    # ── Character Anchor: Visual Style Card ──────────────────────────────────
    # Topato is a factual channel — no fictional protagonist.
    # Style card defines the photographic aesthetic for all image prompts.
    visual_style_card:
      art_style: "Photorealistic 8K cinematic documentary photography, National Geographic aesthetic"
      render_engine: "Real-world photography — no animation, no illustration, no CGI"
      color_treatment: "Dramatic natural lighting, high contrast, deep shadows, saturated subject, 9:16 vertical frame"

    # ── Narrator Persona Card ─────────────────────────────────────────────────
    narrator_persona:
      name: "The Fact Bomber"
      tone: "Punchy, direct, slightly conspiratorial — like a brilliant friend who can't believe you don't know this yet"
      vocabulary:
        - "Short sentences. Max 15 words per sentence in Scenes 1 and 4"
        - "Always lead with the most shocking word or number"
        - "No throat-clearing — start mid-thought as if already deep in the subject"
        - "Dry understatement works better than hyperbole"
      forbidden_words:
        - "amazing"
        - "incredible"
        - "mind-blowing"
        - "fascinating"
        - "really interesting"
        - "believe it or not"
        - "did you know"
        - "actually"
        - "basically"
        - "essentially"
        - "in conclusion"

    youtube_client_id_env: "YOUTUBE_CLIENT_ID_CH2"
    youtube_client_secret_env: "YOUTUBE_CLIENT_SECRET_CH2"
    youtube_refresh_token_env: "YOUTUBE_REFRESH_TOKEN_CH2"
    discord_webhook_env: "DISCORD_WEBHOOK_CH2"
    active: true
    creative_lenses:
      - "Counter-intuitive facts that contradict common beliefs"
      - "Largest, smallest, fastest, oldest things in existence"
      - "Bizarre historical events that sound fictional but are real"
      - "Hidden systems behind everyday life"
      - "Extremely strange biological adaptations"
      - "Facts about things happening right now on Earth"
      - "Mind-blowing space and cosmic phenomena"
      - "Future technologies that already exist in early form"
      - "Crazy probabilities and coincidences"
      - "Deep dives into ordinary objects revealing shocking facts"
      - "Phenomena that seem impossible but are scientifically proven"
      - "Unusual natural disasters or environmental phenomena"
      - "Psychological facts about how humans think, decide, and fool themselves"
      - "Shocking food science facts hiding inside everyday ingredients"
      - "Strange and surprising human body capabilities and hard limits"
      - "Real unsolved historical crimes and mysteries still open today"
      - "Technology secrets hidden inside products everyone owns and uses"
      - "World records so extreme and specific they seem invented"
      - "Strange laws still officially on the books in countries worldwide"
      - "Survival science: what actually kills you in extreme environments"
      - "Optical physics and light phenomena most people never learn about"
      - "Economics and money facts that permanently change how you see prices"
