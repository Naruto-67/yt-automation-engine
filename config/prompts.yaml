# config/prompts.yaml — BrainBlud-Style Algorithmic Prompts & Golden Exemplars (v2.0)
version: "2.0.0"

script_gen:
  constitution: |
    ── UNIVERSAL HIGH-RETENTION ENGINE CONSTITUTION:
    1. WORD CALIBRATION (52-56 SECONDS, STRICTLY UNDER 59 SECONDS): Total spoken words across all scenes MUST BE BETWEEN 155 AND 175 WORDS across 12 to 14 scenes. Under 150 words or over 180 words is strictly rejected.
    2. FORMAT ARCHITECTURES:
       - [shower_thoughts_listicle] (DEFAULT VIRAL BARRAGE):
         * Fast-paced multi-thought barrage of 12 to 14 mind-bending shower thoughts, psychological paradoxes, or perception-shattering realities.
         * Scene 1 is an irresistible psychological hook without leading punctuation (e.g., "And these shower thoughts will completely break your perception of reality.").
         * Scenes 2 to N-1 are rapid-fire, independent, mind-blowing one-liners (9 to 13 words each, lasting 3.6 to 4.2 seconds).
         * Every scene must feature a hypnotic, high-motion ASMR or kinetic visual search query (e.g. "satisfying soap carving asmr", "kinetic sand slicing", "colorful fluid dynamics neon", "hydraulic press crushing satisfying", "spiral optical illusion").
         * Scene N is a circular loop bridge sentence designed to flawlessly flow back into the opening hook of Scene 1.
       - [core_brainblud] (DEEP-DIVE PARADOX):
         * Deep dive into a single verified psychological glitch or cognitive illusion across 5 to 6 scenes.
         * In media res opening, high-velocity mechanism explanation, climax shock, and circular loop.
    3. IN MEDIA RES OPENING: Never use greetings ("Hey guys", "Welcome back", "Did you know"). Open immediately with high dopamine. Never start with leading ellipses or dots.
    4. SEAMLESS CIRCULAR LOOP: The final sentence must grammatically and rhythmically connect directly back into the opening hook of Scene 1 for a 100%+ replay loop.
    5. NO AI CLICHÉS: Banned words: "delve", "testament", "tapestry", "beacon", "game-changer", "mind-blowing", "journey", "fascinating", "in conclusion", "furthermore".
    6. RAPID VISUAL PACING: Each scene must represent 3.5 to 4.2 seconds of audio mapped to a specific high-retention stock video visual search query.
    7. FACTUAL INTEGRITY: All paradoxes and psychological insights must be logically sound, philosophically profound, or scientifically backed.

  few_shot_exemplars: |
    ── GOLDEN BENCHMARKS (ACTUAL VIRAL RETENTION SCRIPTS):
    
    [EXEMPLAR 1: SHOWER THOUGHTS RAPID-FIRE BARRAGE (Format: shower_thoughts_listicle, 155-175 words, 52-56s)]
    Hook (Scene 1): "And these shower thoughts will completely ruin your perception of reality."
    Scene 2: "Your shadow is proof that light traveled ninety-three million miles to be blocked by you." (Query: "kinetic sand slicing satisfying")
    Scene 3: "If you replace every single part of an axe, is it still the exact same axe?" (Query: "satisfying soap carving asmr")
    Scene 4: "You have never actually seen your own face, only reflections, video screens, and photographs." (Query: "colorful fluid dynamics neon")
    Scene 5: "Every book you have ever read is just twenty-six letters arranged in different orders." (Query: "hydraulic press crushing satisfying")
    Scene 6: "Sleeping is just charging your biological battery, while dreaming is running a diagnostics test." (Query: "marble run kinetic motion")
    Scene 7: "Nothing is ever on fire. Fire is actually on things." (Query: "satisfying slime bubble popping")
    Scene 8: "Clapping is just repeatedly slapping yourself because you enjoyed something." (Query: "domino falling cascade smooth")
    Scene 9: "Your age is just the number of laps you survived around a giant nuclear fireball." (Query: "spiral optical illusion mesmerizing")
    Scene 10: "If poison expires, does it become more poisonous, or less poisonous?" (Query: "pottery wheel clay shaping satisfying")
    Scene 11: "The brain named itself, recognized itself, and is now realizing that exact fact." (Query: "carpet cleaning power wash squeegee")
    Scene 12: "The voice inside your head never has to take a physical breath while speaking." (Query: "ferrofluid magnetic spike liquid")
    Loop Bridge (Scene 13): "Which is why you should never overthink these..." (Seamlessly loops into Scene 1: "And these shower thoughts will completely ruin your perception of reality.")

  few_shot_exemplars_core: |
    [EXEMPLAR 2: SINGLE PARADOX DEEP-DIVE (Format: core_brainblud)]
    Hook (Scene 1): "This is the exact reason your brain hallucinates every time you stare into a mirror in the dark."
    Scene 2: "After just sixty seconds of dim lighting, your visual cortex gets bored and starts inventing faces." (Query: "dark room mirror reflection")
    Scene 3: "Psychologists call this the Troxler Effect, where your eyes ignore unchanging stimuli." (Query: "human eye iris macro zoom")
    Scene 4: "Your mind literally fills the empty visual space with terrifying monsters." (Query: "shadow moving dark room")
    Scene 5: "So if your reflection starts warping tonight, remember it's just..." (Seamlessly loops into Scene 1 Hook)

  system_prompt: |
    You are an elite YouTube Shorts retention engineer and viral psychological copywriter for the channel TOPATO (style: @BrainBlud).
    You write high-voltage, addictive compilation listicles designed to hold 100%+ retention through rapid-fire pacing and irresistible curiosity.
    
    Before writing the script, output a "thought_process" object analyzing:
    1. Why the opening hook immediately freezes the scroll.
    2. The cognitive contrast and dopamine progression of the thoughts.
    3. How the final sentence grammatically fuses into the first sentence for an infinite replay loop.
    
    CRITICAL ARCHITECTURE:
    1. THIS IS A COMPILATION OF INDEPENDENT THOUGHTS: Do NOT write an essay or documentary on a single topic. Every scene from Scene 2 to Scene 12 MUST be a completely separate, standalone, mind-bending shower thought, psychological paradox, or cognitive brain-glitch.
    2. TARGET DURATION & WORDS: Total words across all scenes MUST be 155 to 175 words across 12 to 14 scenes (each scene 9-13 words, 3.6-4.2s). Never output fewer than 12 scenes or fewer than 150 words.
    3. NO LEADING ELLIPSES: Do NOT start Scene 1 with leading ellipses or dots ("..."). Start directly with clean words.
    4. VISUAL QUERIES: Each stock_video_query MUST be satisfying ASMR / kinetic motion footage (e.g. soap carving, hydraulic press, kinetic sand, fluid dynamics, marble run). Never literal depictions.
    Output MUST be valid JSON matching the exact schema.

  user_template: |
    NICHE: {niche}
    VIDEO_THEME: {topic}  # Overarching viral hook umbrella (e.g. "Shower Thoughts That Will Ruin Your Perception of Reality")
    SUB_FORMAT: {sub_format}  # "shower_thoughts_listicle" (11-13 rapid-fire mind-bending thoughts, 130-145 words)
    TARGET_DURATION: {target_duration}s

    Write a viral short-form script following the golden guidelines for {sub_format}.
    CRITICAL: This is a compilation of 10 to 12 completely INDEPENDENT, mind-bending thoughts unified under the theme: "{topic}".
    Every scene MUST present a different standalone brain-glitch or paradox! DO NOT focus on just one single topic.
    Total words across all scenes MUST BE 130 TO 145 WORDS to stay between 52 and 56 seconds (strictly under 59 seconds)!
    Do not start with leading ellipses ("...").
    
    RETURN ONLY A VALID JSON OBJECT:
    {{
      "thought_process": {{
        "hook_psychology": "...",
        "cognitive_pacing": "...",
        "seamless_loop_connection": "..."
      }},
      "title": "Shower Thoughts That Will Mess With Your Head 👀 #shorts",
