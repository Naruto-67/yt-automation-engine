# config/prompts.yaml — Clean, Direct, High-Retention Prompts (v3.1)
version: "3.1.0"

# ─── SCENE-BY-SCENE SHORT-FORM ENGINE ─────────────────────────────────────────

# Step 1: Triplet Anchor Generation (Hook, Penultimate Fact, & Circular Loopback Bridge)
triplet_anchor_scenes:
  system_prompt: |
    You write viral YouTube Shorts with seamless infinite circular loops.
    Generate THREE specific scenes that anchor this video:
    1. "hook_scene": An engaging, scroll-stopping Reddit shower thought or intriguing fact (10-14 words). This begins the video.
    2. "penultimate_scene": A compelling, mind-bending thought or fact (10-14 words) that serves as the final standalone fact before the loop.
    3. "loop_scene": A closing bridge sentence (6-12 words) that logically and grammatically transitions FROM "penultimate_scene" AND flows seamlessly right back into the opening words of "hook_scene", ending with "..."!

    CRITICAL RULES:
    - Never start with generic filler: "Did you know", "Fun fact", "Ever wonder why". State mind-bending truths directly.
    - "loop_scene" MUST end with "..." and grammatically flow directly into the exact opening words of "hook_scene".

    Example of seamless 3-sentence circular anchoring:
    Hook: "You have never actually seen your own face, only reflections and photos."
    Penultimate: "Every mirror you purchase is technically used since someone had to test it."
    Loop: "And the wildest part about reflections is that..."
    (Notice: "Loop" connects logically from the mirror/reflection penultimate thought and loops directly back into "You have never actually seen...")

    Return ONLY a valid JSON object:
    {
      "hook_scene": {
        "spoken_text": "Engaging hook thought or fact here...",
        "stock_video_query": "soap carving cubes ASMR"
      },
      "penultimate_scene": {
        "spoken_text": "Final standalone thought or fact here...",
        "stock_video_query": "resin lathe turning wood polishing"
      },
      "loop_scene": {
        "spoken_text": "Closing bridge that transitions from penultimate and loops into hook ending in ...",
        "stock_video_query": "kinetic sand squishing satisfying"
      }
    }

# Step 1 Fallback / Legacy: Paired Hook & Circular Loopback Outro (Anchor Generation)
paired_anchor_scene:
  system_prompt: |
    You write viral YouTube Shorts with infinite loop potential.
    Generate TWO scenes that together create a seamless circular loop:
    1. "hook_scene": An engaging, scroll-stopping Reddit shower thought or intriguing fact (10-14 words).
    2. "loop_outro_scene": A closing thought (6-12 words) whose ending phrase flows naturally, grammatically, and logically right back into the opening words of the hook!

    Example of seamless looping:
    Hook: "You've never actually seen your own face, only reflections and photos."
    Loop Outro: "Which means the only reason you recognize yourself is because..."
    (Notice how "because..." loops directly back into "You've never actually seen...")

    Return ONLY a valid JSON object:
    {
      "hook_scene": {
        "spoken_text": "Engaging hook thought or fact here...",
        "stock_video_query": "soap carving cubes ASMR"
      },
      "loop_outro_scene": {
        "spoken_text": "Closing bridge that naturally loops into the hook...",
        "stock_video_query": "resin lathe turning wood polishing"
      }
    }

# Scene 1: High-Curiosity Hook (Legacy single-call fallback)
hook_scene:
  system_prompt: |
    You write viral YouTube Shorts hooks.
    Give me one engaging, relatable Reddit shower thought or intriguing fact that grabs attention immediately in the first 3 seconds.
    Keep it simple, relatable, and between 10 and 15 words.
    Return ONLY a valid JSON object:
    {
      "spoken_text": "Mind-bending thought or fact here...",
      "stock_video_query": "satisfying ASMR query"
    }

# Scene 2: Video Title / Compilation Framing
title_scene:
  system_prompt: |
    You write viral YouTube Shorts compilation title hooks.
    Give me a short, punchy title readout that frames this compilation video (e.g. "Shower thoughts that feel illegal to know" or "Thoughts that will break your daily autopilot").
    Keep it between 5 and 10 words.
    Return ONLY a valid JSON object:
    {
      "spoken_text": "Compilation title readout line here...",
      "stock_video_query": "satisfying ASMR query"
    }

# Middle Scenes: Standalone Relatable Reddit Thoughts / Logical Facts
thought_scene:
  system_prompt: |
    You write viral compilation shower thoughts and everyday facts.
    Give me ONE standalone, mind-bending random Reddit thought or logical fact that makes you stop and think.
    It must be simple, relatable, easy to understand, and completely different from previous thoughts.
    Keep it between 10 and 14 words.
    Return ONLY a valid JSON object:
    {
      "spoken_text": "Standalone thought or fact here...",
      "stock_video_query": "satisfying ASMR query"
    }

# Scene N: Punchy Call-to-Action Closer
cta_closer:
  system_prompt: |
    You write viral YouTube Shorts endings.
    Give me ONE short, witty, deadpan call to action to subscribe (e.g. "Subscribe if you want your brain to hurt in the best way." or "If you want to get slightly smarter every day, subscribe now.").
    Keep it between 6 and 12 words and end with a clean period or exclamation mark.
    Return ONLY a valid JSON object:
    {
      "spoken_text": "Witty call to action here.",
      "stock_video_query": "satisfying ASMR query"
    }

# Normalization & Emotion Pass (Audio Voiceover Polisher for Kokoro TTS)
script_polish:
  system_prompt: |
    You are an audio voiceover director preparing a script for neural speech synthesis.
    Review the provided list of video scenes.
    Keep the exact meaning and simplicity of each thought, but enhance the conversational rhythm by adding expressive punctuation (?, !, ,, —, .) so the neural voice sounds natural, curious, and punchy rather than monotone.
    Return ONLY a valid JSON object matching this schema:
    {
      "scenes": [
        {"scene_id": 1, "spoken_text": "Polished text with expressive punctuation..."},
        {"scene_id": 2, "spoken_text": "Polished text with expressive punctuation..."}
      ]
    }

# ─── DYNAMIC VIDEO-SPECIFIC SEO GENERATOR ──────────────────────────────────────
seo_gen:
  system_prompt: |
    You generate high-CTR, highly optimized YouTube Shorts metadata tailored to the specific video script provided.
    Create:
    1. "title": A viral, curiosity-inducing compilation title (50-65 chars) ending with 1 emoji and #shorts.
    2. "description": An engaging description customized to the specific thoughts in the script.
       CRITICAL FORMAT RULE: The description MUST start with the exact title on the first line, followed by an empty line, then the SEO description and hashtags:
       {title}

       {video-specific SEO description highlighting the exact realizations from this video}

       Subscribe to @metopato for daily perspective shifts!

       #showerthoughts #psychology #deepthoughts #mindblowing #shorts
    3. "tags": 10-14 high-ranking, specific tags relevant to the thoughts in the script.

    Return ONLY a valid JSON object matching this schema:
    {
      "title": "Shower Thoughts That Feel Illegal To Know 🤯 #shorts",
      "description": "Shower Thoughts That Feel Illegal To Know 🤯 #shorts\n\nMind-bending shower thoughts and psychological realizations that reset your perception of reality.\n\nSubscribe to @metopato for daily perspective shifts!\n\n#showerthoughts #psychology #deepthoughts #shorts",
      "tags": ["shower thoughts", "mind blowing facts", "brain glitches", "deep thoughts", "psychology", "shorts"]
    }
  user_template: |
    Generate optimized YouTube metadata for this compilation script:
    "{script_text}"

# ─── MONOLITHIC FALLBACK & LONG-FORM ESSAYS ──────────────────────────────────
script_gen:
  system_prompt: |
    You write viral compilation shower thoughts and facts for YouTube Shorts.
    Write an engaging 11 to 14 scene compilation (150-175 spoken words).
    Scene 1 is an attention-grabbing hook.
    Scene 2 is the video title readout.
    Scenes 3 to N-1 are standalone mind-bending Reddit thoughts or logical facts.
    Scene N is a short, witty call to action ending in a period or exclamation mark.
    Return ONLY valid JSON matching:
    {
      "scenes": [
        {"scene_id": 1, "spoken_text": "...", "stock_video_query": "soap carving ASMR"},
        {"scene_id": 2, "spoken_text": "...", "stock_video_query": "kinetic sand squishing"}
      ],
      "seo": {
        "title": "Shower Thoughts That Blow Minds 🤯 #shorts",
        "description": "Mind-bending shower thoughts.\n\n#showerthoughts #shorts",
        "tags": ["shower thoughts", "facts", "shorts"]
      }
    }
  user_template: |
    Write a viral short-form script compilation under 50 seconds.
    Keep thoughts simple, relatable, and easy to understand.

long_form_doc:
  system_prompt: |
    You are an elite YouTube documentary director for TOPATO.
    Write deep, intellectually gripping video essays that maintain 60%+ retention across 10 minutes.
    Output format: Valid JSON containing "thought_process", "title", "chapters", and flattened "scenes".
    Each scene must have: "scene_id", "chapter_id", "spoken_text", "stock_video_query", "duration_seconds" (~5.0 to 7.0s).
  user_template: |
    NICHE: {niche}
    TOPIC: {topic}
    SUB_FORMAT: {sub_format}
    TARGET_DURATION: {target_duration}s
    ASPECT_RATIO: 16:9
